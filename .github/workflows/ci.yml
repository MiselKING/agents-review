# Keep this name: pr-mark-ready.yml and claude-ci-fix.yml listen for it by name.
name: CI
run-name: >-
  ${{
    github.event_name == 'push' && format('CI · push to {0}', github.ref_name)
    || format('CI · #{0}', github.event.pull_request.number)
  }}

on:
  # Every PR, whatever its target branch (main today, maybe develop or qa later). Drafts included.
  pull_request:
  # Long-lived branches. Add develop, qa or others here when they exist.
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on long-lived branches always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      # Installs pnpm from package.json `packageManager`, Node from .nvmrc, then runs `pnpm install`.
      - id: install
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 5
        with:
          cache: true
          require-lockfile: true
      # Each check runs even if an earlier one failed, so one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: pnpm typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm test
      - name: Generated code is up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: pnpm codegen:check
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        run: pnpm format:check

  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 5
        with:
          cache: true
          # Only the checks job saves the cache; parallel saves of the same key collide.
          save-cache: false
          install: false
      # The AGENTS.md first-time setup command, exactly as written: a fresh clone must work.
      - name: First-time setup
        timeout-minutes: 5
        run: cp .env.example .env && pnpm install && docker compose up -d && pnpm db:migrate && pnpm db:seed
      # Needs the migrated database from the step above.
      - name: Database tests
        timeout-minutes: 3
        run: pnpm test:db

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Chromium and its system packages come with the image. Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:4d70b558dbaff71611b2f3e7a32aa2b4d42cfc892078ad368cb7ea229c2ffd1f
      options: --user 1001
    # This image has no Docker, so Postgres runs beside the job. Keep the tag equal to docker-compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_review
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d agents_review"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service's hostname is its name. Real env vars win over the copied .env.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agents_review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 5
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      - run: cp .env.example .env
      - name: Migrate and seed
        timeout-minutes: 3
        run: pnpm db:migrate && pnpm db:seed
      - name: E2E tests
        timeout-minutes: 10
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Workflow files: expressions, contexts and permissions, plus every `run:` script through ShellCheck.
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      # Pinned releases, checked against their SHA-256 (as GitHub lists them for each release asset).
      - name: Install actionlint and ShellCheck
        timeout-minutes: 2
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          mkdir -p bin
          tar -xzf actionlint.tar.gz -C bin actionlint
          tar -xJf shellcheck.tar.xz -C bin --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
      # The ShellCheck path is explicit: if it were missing, actionlint would skip the scripts silently.
      - name: Lint the workflows
        timeout-minutes: 2
        run: |
          "$RUNNER_TEMP/bin/shellcheck" --version
          "$RUNNER_TEMP/bin/actionlint" -shellcheck "$RUNNER_TEMP/bin/shellcheck"

  # The one check that rulesets require, on any branch.
  ci:
    if: ${{ always() }}
    needs: [checks, setup, e2e, actionlint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "At least one job did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1
