name: Claude mention
# Every comment and review starts a run; those that start no job are named so they're easy to skip.
run-name: >-
  ${{
    (
      !contains(github.event.comment.body || github.event.review.body, '@claude') ||
      (github.event.comment.user.type || github.event.review.user.type) == 'Bot' ||
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    ) && format('Claude · #{0} (skipped)', github.event.issue.number || github.event.pull_request.number)
    || startsWith(github.event.comment.body || github.event.review.body, '@claude plan')
      && format('Claude plan · #{0}', github.event.issue.number || github.event.pull_request.number)
    || format('Claude · #{0}', github.event.issue.number || github.event.pull_request.number)
  }}

# Runs whenever an issue comment, PR comment or PR review mentions `@claude`.
#
# Your comment is the task: Claude works out what to do from what you wrote. It also reads the
# issue or PR, the comments by people with write access, and for a PR its diff, so you don't
# need to repeat them.
#
# - `@claude plan`: Opus replies with a plan and changes nothing. You approve the plan by
#   adding the `agent` label (claude-build.yml).
# - Anything else: Sonnet does what the comment asks, runs the checks, and the App commits
#   its changes to the PR's branch, or opens a draft PR for an issue.
#
# The work happens in claude-work.yml. Comments from bots and from people without write
# access start no job.
on:
  # A new comment on an issue, or in a PR's Conversation tab.
  issue_comment:
    types: [created]
  # A new comment on a line in a PR's Files changed tab.
  pull_request_review_comment:
    types: [created]
  # A submitted PR review; its summary text can mention @claude.
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: >-
      ${{
        contains(github.event.comment.body || github.event.review.body, '@claude') &&
        (github.event.comment.user.type || github.event.review.user.type) != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
      }}
    # One Claude run at a time per issue or PR, shared with claude-build.yml and after-ci.yml.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # The most any job in claude-work.yml gets; the jobs there narrow it.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/claude-work.yml
    with:
      mode: ${{ startsWith(github.event.comment.body || github.event.review.body, '@claude plan') && 'plan' || 'work' }}
      trigger: comment
      number: ${{ github.event.issue.number || github.event.pull_request.number }}
      request: ${{ github.event.comment.body || github.event.review.body }}
      location: ${{ github.event.comment.path && format('{0}:{1}', github.event.comment.path, github.event.comment.line) || '' }}
    # Environment secrets reach a called workflow only this way; each job there names its environment.
    secrets: inherit
