name: Claude label
run-name: >-
  ${{
    github.event.label.name == 'agent:build' && format('Claude build · #{0}', github.event.issue.number)
    || github.event.label.name == 'agent:plan' && format('Claude plan · #{0}', github.event.issue.number)
    || format('Claude label · #{0} label {1} (skipped)', github.event.issue.number, github.event.label.name)
  }}

# The `agent:` labels on an issue start Claude. The work happens in claude-work.yml.
# - `agent:plan`: Claude replies with a plan and changes nothing, like an `@claude plan` comment. The
#   label is removed when the run starts, so adding it again asks for a new plan.
# - `agent:build`: Claude builds the issue from the approved plan, and the App opens the draft PR.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  # A build label is your approval of the issue, its title, description and comments as they were when you
  # added it. The build may wait for another Claude run first, so this records them right away;
  # claude-work.yml builds only if none of them changed or was deleted after the label.
  check:
    if: ${{ github.event.label.name == 'agent:plan' || github.event.label.name == 'agent:build' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      issues: read
    outputs:
      approved: ${{ steps.record.outputs.approved }}
    steps:
      # The action checks this too, but only after the App has replied and the runners have started.
      - name: Check who added the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          if [ "$SENDER_TYPE" != User ]; then
            echo "::error::The \`$LABEL\` label was added by $SENDER, which is not a person."
            exit 1
          fi
          # `permission` is admin, write, read or none; maintain counts as write and triage as read.
          permission=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$permission" in
            admin | write) ;;
            *)
              echo "::error::$SENDER added the \`$LABEL\` label without write access ($permission)."
              exit 1
              ;;
          esac
      - id: record
        if: ${{ github.event.label.name == 'agent:build' }}
        name: Record the issue at approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          # The issue as the label event carried it: exactly what you approved, even if it changes a second later.
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # Keep this hash the same as in claude-work.yml: the title, a line break, then the description.
          issue=$(printf '%s\n%s' "$TITLE" "$BODY" | sha256sum | cut -d' ' -f1)
          # Each read goes to a file first, so a read that fails partway stops the step instead of recording part
          # of the issue (a pipe would hide it: this shell has no pipefail).
          gh api --paginate "repos/$REPO/issues/$NUMBER/events" > "$RUNNER_TEMP/events.json"
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" > "$RUNNER_TEMP/comments.json"
          # This job starts a few seconds after the label, so comments are compared with the label's own time.
          labeled_at=$(jq -s -r '[.[][] | select(.event == "labeled" and .label.name == "agent:build")] | last | .created_at // empty' \
            "$RUNNER_TEMP/events.json")
          [ -n "$labeled_at" ] || { echo "::error::No \`agent:build\` label event on #$NUMBER."; exit 1; }
          # Comments posted after the label are left out. claude-work.yml stops on any edited after it.
          approved=$(jq -s -c --arg issue "$issue" --arg at "$labeled_at" \
            '{issue: $issue, labeled_at: $at,
              comments: [.[][] | select(.created_at <= $at) | {id, updated_at, author_association, user: {login: .user.login}}]}' \
            "$RUNNER_TEMP/comments.json")
          # claude-work.yml reads this from one environment variable, and Linux refuses one over 128 KiB. Never
          # trimmed: a shorter record would leave approved comments out.
          if [ "${#approved}" -gt 100000 ]; then
            echo "::error::#$NUMBER has too many comments to record the approval (${#approved} characters). Move the plan to a new issue."
            exit 1
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

  claude:
    needs: check
    # One Claude run at a time per issue or PR, shared with the other Claude workflows; `queue: max` keeps every waiting run.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/claude-work.yml
    with:
      mode: ${{ github.event.label.name == 'agent:plan' && 'plan' || 'work' }}
      trigger: label
      number: ${{ github.event.issue.number }}
      approved: ${{ needs.check.outputs.approved }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
