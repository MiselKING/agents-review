name: Claude build
run-name: >-
  ${{
    github.event.label.name == 'agent' && format('Claude build · #{0}', github.event.issue.number)
    || format('Claude build · #{0} label {1} (skipped)', github.event.issue.number, github.event.label.name)
  }}

# The `agent` label on an issue: Claude builds it from the approved plan, and the App opens
# the draft PR. The work happens in claude-work.yml.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  build:
    if: ${{ github.event.label.name == 'agent' }}
    # One Claude run at a time per issue or PR, shared with the other Claude workflows; `queue: max` keeps every waiting run.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/claude-work.yml
    with:
      mode: work
      trigger: label
      number: ${{ github.event.issue.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
