name: Claude build
run-name: >-
  ${{
    github.event.label.name == 'agent' && format('Claude build · #{0}', github.event.issue.number)
    || format('Claude build · #{0} label {1} (skipped)', github.event.issue.number, github.event.label.name)
  }}

# The `agent` label on an issue: Claude builds it on a branch, then this workflow opens the draft PR.
on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.label.name == 'agent' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action trades this for the Claude GitHub App token it pushes with.
      id-token: write
      actions: read
    outputs:
      branch: ${{ steps.claude.outputs.branch_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 1
          # A saved GITHUB_TOKEN would outrank the app token on push, so CI waits for approval.
          persist-credentials: false
      # For `pnpm format` and `pnpm codegen`, the only commands Claude may run.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        timeout-minutes: 5
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      # The action saves images from the issue here, outside the workspace, and Claude reads them.
      - name: Create the comment images folder
        timeout-minutes: 1
        run: mkdir -p /tmp/github-images
      # No `github_token` input: pushes made with GITHUB_TOKEN don't start CI.
      - id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's default is `claude`; without this, the `agent` label wouldn't start a run.
          label_trigger: agent
          # With a prompt, this keeps the branch and the progress comment of an `@claude` run.
          track_progress: true
          # Commands Claude runs see its tokens, and tests and project scripts run the branch's code, so CI runs the checks.
          # No hooks: they run lint and typecheck. Claude's file tools refuse paths outside the workspace and the images folder.
          settings: '{"disableAllHooks": true, "permissions": {"blockReadsOutsideWorkingDirectories": true}}'
          prompt: |
            Build issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue and every comment on it. If a comment holds an implementation
               plan, the latest plan together with the maintainer's corrections after it is
               the approved plan: follow it, and where a correction disagrees with the plan,
               the correction wins. If there is no plan, build from the acceptance criteria.
            2. Follow AGENTS.md. Stay inside the issue's scope and its "Out of scope" section.
            3. Run `pnpm codegen` if you changed the GraphQL schema or queries, then
               `pnpm format`. Those are the only commands you can run here: CI runs lint,
               typecheck and every test after you push, and asks you to fix a failure. If the
               work needs a change to package.json, .npmrc, pnpm-workspace.yaml, codegen.ts or
               .oxfmtrc.json, don't make it; explain in your comment why it's needed.
            4. Commit with Conventional Commits and push your branch. Make the first commit's
               subject the PR title you want. Do not open the PR; the workflow does.
            5. Finish your comment on the issue with: what changed, why, how you tested it,
               each acceptance criterion as met or not met, and where you left the plan and why.

            If the work needs something AGENTS.md lists under "Ask first", don't do it; stop
            and explain in your comment why it's needed.
          # Opus wrote the plan; Sonnet builds from it. A full model ID, so it changes only here.
          # acceptEdits, the action's strict mode for this kind of run: edits inside the checkout, other commands only
          # from allow rules. The default, auto, lets a safety review approve commands the list leaves out.
          # The deny rules cover the pnpm commands .claude/settings.json allows, the files that change what
          # format and codegen run, and .git: its config holds the token, and its hooks run on commit.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --permission-mode acceptEdits
            --add-dir /tmp/github-images
            --allowedTools "Bash(pnpm format),Bash(pnpm codegen)"
            --disallowedTools "Bash(pnpm lint*),Bash(pnpm typecheck*),Bash(pnpm test*),Bash(pnpm --filter*),Read(./.git/**),Read(//proc/**),Edit(./.git/**),Edit(**/package.json),Edit(**/.npmrc),Edit(./pnpm-workspace.yaml),Edit(./codegen.ts),Edit(./.oxfmtrc.json),Edit(./.pnpmfile.cjs),Edit(./.pnpmfile.mjs),Edit(**/node_modules/**),Edit(**/AGENTS.md),Edit(**/CLAUDE.md),Edit(./REVIEW.md),Edit(./.claude/**),Edit(./.github/**),Edit(./.devcontainer/**)"

  # A fresh runner with no checkout: the build job held the branch Claude wrote, so the personal token stays out of it.
  open-pr:
    needs: build
    if: ${{ needs.build.outputs.branch != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # A personal token, so CI runs on the PR without "Approve workflows to run".
      - name: Open the draft PR
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.build.outputs.branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[].number')" ]; then
            echo "A PR for $BRANCH already exists."
            exit 0
          fi
          title=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq '.commits[0].commit.message // empty' | head -n 1 || true)
          if [ -z "$title" ]; then
            echo "No commits on $BRANCH, so there is no PR to open."
            exit 0
          fi
          printf 'Closes #%s\n\nBuilt by Claude from the plan approved on #%s. What changed, why and how it was tested: see the summary comment on the issue.\n' "$ISSUE" "$ISSUE" > "$RUNNER_TEMP/pr-body.md"
          gh pr create --repo "$REPO" --draft --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
