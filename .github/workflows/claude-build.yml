name: Claude build
run-name: >-
  ${{
    github.event.label.name == 'agent' && format('Claude build · #{0}', github.event.issue.number)
    || format('Claude build · #{0} label {1} (skipped)', github.event.issue.number, github.event.label.name)
  }}

# The `agent` label on an issue: Claude builds it from the approved plan, and the App opens
# the draft PR. The work happens in claude-work.yml.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  # The label is your approval of the issue, its title, description and comments as they were when you added
  # it. The build may wait for another Claude run first, so this records them right away; claude-work.yml
  # builds only if none of them changed or was deleted after the label.
  approve:
    if: ${{ github.event.label.name == 'agent' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      issues: read
    outputs:
      approved: ${{ steps.record.outputs.approved }}
    steps:
      # The action checks this too, but only after the App has replied and the build's runners have started.
      - name: Check who added the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          if [ "$SENDER_TYPE" != User ]; then
            echo "::error::The \`agent\` label was added by $SENDER, which is not a person."
            exit 1
          fi
          # `permission` is admin, write, read or none; maintain counts as write and triage as read.
          permission=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$permission" in
            admin | write) ;;
            *)
              echo "::error::$SENDER added the \`agent\` label without write access ($permission)."
              exit 1
              ;;
          esac
      - id: record
        name: Record the issue at approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          # The issue as the label event carried it: exactly what you approved, even if it changes a second later.
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # Keep this hash the same as in claude-work.yml: the title, a line break, then the description.
          issue=$(printf '%s\n%s' "$TITLE" "$BODY" | sha256sum | cut -d' ' -f1)
          # This job starts a few seconds after the label, so comments are compared with the label's own time.
          labeled_at=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" \
            | jq -s -r '[.[][] | select(.event == "labeled" and .label.name == "agent")] | last | .created_at // empty')
          [ -n "$labeled_at" ] || { echo "::error::No \`agent\` label event on #$NUMBER."; exit 1; }
          # Comments posted after the label are left out. claude-work.yml stops on any edited after it.
          # Small entries: claude-work.yml reads this from one environment variable, limited to 128 KiB.
          approved=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            | jq -s -c --arg issue "$issue" --arg at "$labeled_at" \
              '{issue: $issue, labeled_at: $at,
                comments: [.[][] | select(.created_at <= $at) | {id, updated_at, author_association, user: {login: .user.login}}]}')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

  build:
    needs: approve
    # One Claude run at a time per issue or PR, shared with the other Claude workflows; `queue: max` keeps every waiting run.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/claude-work.yml
    with:
      mode: work
      trigger: label
      number: ${{ github.event.issue.number }}
      approved: ${{ needs.approve.outputs.approved }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
