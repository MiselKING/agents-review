name: Ready check
# Named before the job runs, so a PR that was already ready still shows "Ready check · #N".
run-name: >-
  ${{
    github.event.workflow_run.event != 'pull_request' && format('Ready check · push to {0} (skipped)', github.event.workflow_run.head_branch)
    || github.event.workflow_run.conclusion != 'success' && format('Ready check · #{0} CI failed (skipped)', github.event.workflow_run.pull_requests[0].number)
    || format('Ready check · #{0}', github.event.workflow_run.pull_requests[0].number)
  }}

# CI passed on a draft PR: mark it ready for review, which starts the reviews (claude-review.yml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  ready:
    # No checkout and no PR code runs here; the job only calls the GitHub API.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # A personal token: an event caused by GITHUB_TOKEN wouldn't start the review workflow.
      - name: Mark the draft PR ready
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --draft --json number,headRefOid \
            --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")][0].number // empty")
          if [ -z "$number" ]; then
            echo "No open draft PR at $HEAD_SHA: already ready, closed, or the branch moved on."
            exit 0
          fi
          gh pr ready "$number" --repo "$REPO"
