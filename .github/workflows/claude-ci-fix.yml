name: Claude CI fix
run-name: >-
  ${{
    (github.event.workflow_run.conclusion != 'failure' || github.event.workflow_run.event != 'pull_request')
      && format('Claude CI fix · {0} CI {1} (skipped)', github.event.workflow_run.head_branch, github.event.workflow_run.conclusion)
    || format('Claude CI fix · {0}', github.event.workflow_run.pull_requests[0].number && format('#{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.head_branch)
  }}

# CI failed on a PR: ask Claude for one fix with an `@claude` comment. claude.yml does the work: it reads the
# failed logs with the action's CI tools and pushes the fix. One request per PR; delete it to allow another.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# Two failed runs on the same branch must not both post a request.
concurrency:
  group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # No checkout and no PR code: this job only calls the GitHub API.
  request-fix:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Ask Claude on the PR to fix the failure
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          # A comment posted with GITHUB_TOKEN starts no workflow, so the request uses your token.
          COMMENT_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: '<!-- claude-ci-fix -->'
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,headRefOid \
            --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")][0].number // empty")
          if [ -z "$pr" ]; then
            echo "No open PR at $HEAD_SHA: closed, or the branch moved on and CI runs again there."
            exit 0
          fi
          # Only requests from people with write access count, so a pasted marker can't block one.
          # A failed lookup stops the step here, so it can't be mistaken for "no request yet".
          requests=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body')
          if printf '%s\n' "$requests" | grep -qF "$MARKER"; then
            echo "::notice::#$pr already had its automatic fix request. Take over, or delete that comment to allow another."
            exit 0
          fi
          # `ci` only collects the other jobs' results; a cancelled or skipped job is not something to fix.
          jobs=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and .name != "ci") | .name] | join(", ")')
          if [ -z "$jobs" ]; then
            echo "No job failed apart from ci, so there is nothing to fix."
            exit 0
          fi
          cat > "$RUNNER_TEMP/request.md" <<EOF
          @claude CI failed on this PR in: $jobs ([CI run]($RUN_URL)).

          Read the failed jobs' logs with your CI tools, find the root cause of each failure, and push one fix to this branch.
          - Fix the code when the code is wrong. Change a test only when the test itself is wrong; never delete, skip or weaken one.
          - If the cause is infrastructure (network, runner, timeout), or the fix needs something AGENTS.md lists under "Ask first" or "Never", change nothing and explain what I should do.
          - Before you push, run the checks AGENTS.md lists for the change.

          $MARKER
          _Posted automatically after CI failed. One request per PR: if CI fails again, take over. Delete this comment to allow another request._
          EOF
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/request.md"
